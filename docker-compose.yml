# docker-compose.yml — AMBIENTE DE DESENVOLVIMENTO do Fodinha.
#
# Não há serviços acessórios (banco, cache, fila) no MVP: as salas vivem em memória
# no servidor. Aqui sobem apenas a aplicação (server + web) com hot reload.
#
# Estratégia de dependências: o código vem do host por bind mount, mas o node_modules
# de cada workspace fica em VOLUME NOMEADO. Como o host é Windows, binários nativos
# (esbuild, rollup) instalados lá não funcionam no Linux/musl do container. O serviço
# one-shot `deps` instala tudo DENTRO do container; server e web só sobem depois dele.
#
# Suba com:  scripts\dev.bat start   (Windows)   ou   ./scripts/dev.sh start   (Linux/Mac)

name: fodinha

x-node-comum: &node-comum
  image: node:24-alpine
  working_dir: /app
  env_file:
    - path: .env
      required: false

x-volumes-codigo: &volumes-codigo
  - .:/app
  - node_modules_raiz:/app/node_modules
  - node_modules_server:/app/apps/server/node_modules
  - node_modules_web:/app/apps/web/node_modules
  - node_modules_shared:/app/packages/shared/node_modules

services:
  # Instala as dependências dentro do container e termina (one-shot).
  # Só reinstala quando package.json/package-lock.json mudam (hash em node_modules/.deps-hash).
  deps:
    <<: *node-comum
    restart: 'no'
    volumes: *volumes-codigo
    command:
      - sh
      - -c
      - |
        set -e
        HASH=$$(cat package.json package-lock.json apps/*/package.json packages/*/package.json | md5sum | cut -d' ' -f1)
        if [ -f node_modules/.deps-hash ] && [ "$$(cat node_modules/.deps-hash)" = "$$HASH" ]; then
          echo "[deps] dependencias em dia"
        else
          echo "[deps] instalando dependencias..."
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund --no-package-lock
          echo "$$HASH" > node_modules/.deps-hash
        fi

  server:
    <<: *node-comum
    restart: unless-stopped
    depends_on:
      deps:
        condition: service_completed_successfully
    volumes: *volumes-codigo
    command: npm run dev -w @fodinha/server
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: ${PORT:-3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Só no ambiente de desenvolvimento: libera o evento dev:cenario (mesa lotada de bots).
      CENARIOS_DE_TESTE: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:$${PORT:-3001}/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  web:
    <<: *node-comum
    restart: unless-stopped
    depends_on:
      deps:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    volumes: *volumes-codigo
    command: npm run dev -w @fodinha/web -- --host 0.0.0.0 --port 5173 --strictPort
    environment:
      NODE_ENV: development
      # O navegador (no host) é quem fala com o servidor, por isso localhost e não o nome do serviço.
      VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3001}
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    ports:
      - '${WEB_PORT:-5173}:5173'

volumes:
  node_modules_raiz:
  node_modules_server:
  node_modules_web:
  node_modules_shared:
