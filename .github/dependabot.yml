# Pacotes vulneráveis aparecem como PR em vez de esperar alguém rodar `npm audit` à mão.
# Majoritárias (React, ESLint, TypeScript) vêm separadas: costumam pedir ajuste no código.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
